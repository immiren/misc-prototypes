<!DOCTYPE html>
<html lang="en" style="height: 100%;">

<head>
    <title>HTNP prototype</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="height: 100%;">
    <div class="container">
        <h1 id="header">Test</h1>
        <div style="max-height:max-content; display: grid; grid-template-columns: 30% 40% 30%; min-height:100vh;">
            <div >
                <div style="border: solid 1px white; margin: 3px; padding-left: 1em; ">
                    <p>Settings here</p>
                </div>
                <div style="overflow-y:scroll; border: solid 1px white; margin: 3px; padding-left: 1em; ">
                    <p>Dev log: </p>
                    <p id="devLog"></p>
                </div>
            </div>
            <div style="overflow-y:scroll; border: solid 1px white; margin: 3px; padding-left: 1em">
                <p>Task log: </p>
                <p id="taskLog"></p>
            </div>
            <div style="border: solid 1px white; margin: 3px; padding-left: 1em">
                <p>World state: </p>
                <div id="worldState">
                    
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../dist/bundle.js" crossorigin="anonymous"></script>
</body>

</html>
